name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Note: the test suite depends on guest-notes/ (real guest PII,
      # intentionally excluded from git -- see .gitignore) so it can't
      # run here. Tests run locally against the real sample PDFs instead;
      # this workflow's only job is producing the .exe artifact.
      - name: Build executable
        run: pyinstaller fd_reader.spec

      - name: Zip the build
        run: Compress-Archive -Path dist/GuestYelpCheck -DestinationPath GuestYelpCheck-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GuestYelpCheck-windows
          path: GuestYelpCheck-windows.zip
          retention-days: 30
