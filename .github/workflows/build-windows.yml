name: Build Windows executable
# Without this, each run in the Actions tab is titled after whatever
# commit message triggered it -- run-name is evaluated before checkout,
# so it can't read fd_reader/__init__.py's __version__ (that's read later,
# inside the job, for the artifact name below); this keeps the run list
# readable with the program name instead of the triggering commit message.
run-name: GuestYelpCheck build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Note: the test suite depends on guest-notes/ (real guest PII,
      # intentionally excluded from git -- see .gitignore) so it can't
      # run here. Tests run locally against the real sample PDFs instead;
      # this workflow's only job is producing the .exe artifact.
      - name: Build executable
        run: pyinstaller fd_reader.spec

      - name: Read version
        id: version
        run: |
          $version = (Select-String -Path fd_reader/__init__.py -Pattern '__version__ = "(.+)"').Matches.Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Zip the build
        run: Compress-Archive -Path dist/GuestYelpCheck -DestinationPath GuestYelpCheck-${{ steps.version.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GuestYelpCheck-${{ steps.version.outputs.version }}
          path: GuestYelpCheck-${{ steps.version.outputs.version }}.zip
          retention-days: 30
